services:
  ocr-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      # Any OpenAI-compatible API works — set LLM_BASE_URL accordingly.
      # See .env.example for OpenAI / OpenRouter / opencode.ai / Ollama examples.
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_VISION_MODEL=${LLM_VISION_MODEL:-gpt-4o}
      - LLM_JSON_MODE=${LLM_JSON_MODE:-true}
      - LLM_SITE_URL=${LLM_SITE_URL:-}
      - LLM_SITE_NAME=${LLM_SITE_NAME:-}
      - OCR_TIMEOUT=${OCR_TIMEOUT:-30}
      - SCANNED_TEXT_THRESHOLD=${SCANNED_TEXT_THRESHOLD:-50}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Provider examples (set in .env) ──────────────────────────────────────
  #
  # OpenAI:
  #   LLM_BASE_URL=https://api.openai.com/v1
  #   LLM_API_KEY=sk-...
  #   LLM_MODEL=gpt-4o
  #   LLM_VISION_MODEL=gpt-4o
  #
  # OpenRouter:
  #   LLM_BASE_URL=https://openrouter.ai/api/v1
  #   LLM_API_KEY=sk-or-...
  #   LLM_MODEL=anthropic/claude-3.5-sonnet
  #   LLM_VISION_MODEL=anthropic/claude-3.5-sonnet
  #   LLM_SITE_URL=https://yourapp.com
  #   LLM_SITE_NAME=MorangeOCR
  #
  # Google Gemini (direct via Google AI Studio):
  #   LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
  #   LLM_API_KEY=AIza-...
  #   LLM_MODEL=gemini-2.0-flash
  #   LLM_VISION_MODEL=gemini-2.0-flash
  #
  # Google Gemini (via OpenRouter):
  #   LLM_BASE_URL=https://openrouter.ai/api/v1
  #   LLM_API_KEY=sk-or-...
  #   LLM_MODEL=google/gemini-2.0-flash-001
  #   LLM_VISION_MODEL=google/gemini-2.0-flash-001
  #
  # opencode.ai (check their docs for base URL):
  #   LLM_BASE_URL=https://api.opencode.ai/v1
  #   LLM_API_KEY=your-key
  #   LLM_MODEL=model-name
  #   LLM_VISION_MODEL=model-name
  #
  # Ollama (local):
  #   LLM_BASE_URL=http://ollama:11434/v1
  #   LLM_API_KEY=none
  #   LLM_MODEL=qwen2.5:7b
  #   LLM_VISION_MODEL=qwen2.5vl:7b
  #
  # ─────────────────────────────────────────────────────────────────────────
